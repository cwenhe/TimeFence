name: 发布签名 APK

on:
  push:
    tags:
      - "v*"

permissions: {}

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: 测试并构建签名 APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: release
    permissions:
      contents: read
    outputs:
      version_name: ${{ steps.version.outputs.version_name }}
      version_code: ${{ steps.version.outputs.version_code }}
      apk_name: ${{ steps.version.outputs.apk_name }}

    steps:
      - name: 检出完整源码历史
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 校验标签、主分支与版本边界
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::标签必须严格符合 vMAJOR.MINOR.PATCH，且版本段不能包含前导零"
            exit 1
          fi

          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          patch="${BASH_REMATCH[3]}"
          if (( ${#major} > 4 || ${#minor} > 3 || ${#patch} > 3 )); then
            echo "::error::版本超出范围：MAJOR 最大 2099，MINOR 和 PATCH 最大 999"
            exit 1
          fi
          if (( 10#${major} > 2099 || 10#${minor} > 999 || 10#${patch} > 999 )); then
            echo "::error::版本超出范围：MAJOR 最大 2099，MINOR 和 PATCH 最大 999"
            exit 1
          fi

          version_code=$((10#${major} * 1000000 + 10#${minor} * 1000 + 10#${patch}))
          if (( version_code < 1 || version_code > 2099999999 )); then
            echo "::error::计算得到的 Android versionCode 必须位于 1..2099999999"
            exit 1
          fi

          if ! git show-ref --verify --quiet refs/remotes/origin/main; then
            echo "::error::完整检出后仍找不到 origin/main，无法验证发版来源"
            exit 1
          fi
          tag_commit="$(git rev-parse "${GITHUB_REF_NAME}^{commit}")"
          if ! git merge-base --is-ancestor "${tag_commit}" refs/remotes/origin/main; then
            echo "::error::标签提交不属于 origin/main，拒绝签名发版"
            exit 1
          fi

          version_name="${GITHUB_REF_NAME#v}"
          echo "version_name=${version_name}" >> "${GITHUB_OUTPUT}"
          echo "version_code=${version_code}" >> "${GITHUB_OUTPUT}"
          echo "apk_name=timefence-${version_name}.apk" >> "${GITHUB_OUTPUT}"

      - name: 校验签名 Secrets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.TIMEFENCE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.TIMEFENCE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TIMEFENCE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.TIMEFENCE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          [[ -n "${KEYSTORE_BASE64}" ]] || missing+=(TIMEFENCE_KEYSTORE_BASE64)
          [[ -n "${KEYSTORE_PASSWORD}" ]] || missing+=(TIMEFENCE_KEYSTORE_PASSWORD)
          [[ -n "${KEY_ALIAS}" ]] || missing+=(TIMEFENCE_KEY_ALIAS)
          [[ -n "${KEY_PASSWORD}" ]] || missing+=(TIMEFENCE_KEY_PASSWORD)
          if (( ${#missing[@]} > 0 )); then
            echo "::error::release Environment 缺少 Secrets: ${missing[*]}"
            exit 1
          fi

      - name: 配置 JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 配置 Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: 安装固定 Android SDK 组件
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: 解码临时签名文件
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.TIMEFENCE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          install -d -m 700 "${RUNNER_TEMP}/timefence-signing"
          printf '%s' "${KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/timefence-signing/release.jks"
          chmod 600 "${RUNNER_TEMP}/timefence-signing/release.jks"
          test -s "${RUNNER_TEMP}/timefence-signing/release.jks"

      - name: 测试并构建 Release APK
        env:
          TIMEFENCE_KEYSTORE_FILE: ${{ runner.temp }}/timefence-signing/release.jks
          TIMEFENCE_KEYSTORE_PASSWORD: ${{ secrets.TIMEFENCE_KEYSTORE_PASSWORD }}
          TIMEFENCE_KEY_ALIAS: ${{ secrets.TIMEFENCE_KEY_ALIAS }}
          TIMEFENCE_KEY_PASSWORD: ${{ secrets.TIMEFENCE_KEY_PASSWORD }}
          TIMEFENCE_VERSION_NAME: ${{ steps.version.outputs.version_name }}
          TIMEFENCE_VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: ./gradlew --no-daemon clean testDebugUnitTest lintRelease assembleRelease

      - name: 验证签名、证书与安装包
        shell: bash
        env:
          APK_NAME: ${{ steps.version.outputs.apk_name }}
          EXPECTED_CERT_SHA256: ${{ vars.TIMEFENCE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          source_apk="app/build/outputs/apk/release/app-release.apk"
          test -s "${source_apk}"
          rm -rf dist
          install -d -m 0755 dist
          install -m 0644 "${source_apk}" "dist/${APK_NAME}"

          signer_output="$("${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify --verbose --print-certs "dist/${APK_NAME}")"
          printf '%s\n' "${signer_output}"
          actual_cert_sha256="$(printf '%s\n' "${signer_output}" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1 | tr -d '[:space:]:' | tr '[:lower:]' '[:upper:]')"
          if [[ ! "${actual_cert_sha256}" =~ ^[0-9A-F]{64}$ ]]; then
            echo "::error::无法从 apksigner 输出读取签名证书 SHA-256"
            exit 1
          fi

          expected_cert_sha256="$(printf '%s' "${EXPECTED_CERT_SHA256}" | tr -d '[:space:]:' | tr '[:lower:]' '[:upper:]')"
          if [[ -n "${expected_cert_sha256}" ]]; then
            if [[ ! "${expected_cert_sha256}" =~ ^[0-9A-F]{64}$ ]]; then
              echo "::error::TIMEFENCE_CERT_SHA256 必须是 64 位十六进制摘要，可包含冒号"
              exit 1
            fi
            if [[ "${actual_cert_sha256}" != "${expected_cert_sha256}" ]]; then
              echo "::error::签名证书 SHA-256 与 release Environment 配置不一致"
              exit 1
            fi
          else
            echo "::notice::未配置 TIMEFENCE_CERT_SHA256；当前签名证书 SHA-256 为 ${actual_cert_sha256}"
          fi

          (
            cd dist
            sha256sum "${APK_NAME}" > "${APK_NAME}.sha256"
          )

      - name: 清理临时签名文件
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "${RUNNER_TEMP}/timefence-signing"
          test ! -e "${RUNNER_TEMP}/timefence-signing"

      - name: 上传已验证的发布产物
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: timefence-release-${{ steps.version.outputs.version_name }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: 创建 GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: 下载已验证的发布产物
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: timefence-release-${{ needs.build.outputs.version_name }}
          path: dist

      - name: 复核校验值并创建 Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          APK_NAME: ${{ needs.build.outputs.apk_name }}
        run: |
          set -euo pipefail
          test -s "dist/${APK_NAME}"
          test -s "dist/${APK_NAME}.sha256"
          (
            cd dist
            sha256sum -c "${APK_NAME}.sha256"
          )
          gh release create "${GITHUB_REF_NAME}" \
            "dist/${APK_NAME}" \
            "dist/${APK_NAME}.sha256" \
            --verify-tag \
            --title "时界 ${GITHUB_REF_NAME}" \
            --generate-notes
